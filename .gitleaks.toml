# gitleaks configuration for go-atlas (full-history scans and the CI gate).
#
# Every allowlist entry below is a finding verified as synthetic during the
# 2026-07 open-source security audit: generated test-only key material,
# documentation placeholders, or test fixtures whose purpose is to exercise
# masking/redaction. Real secrets must NEVER be allowlisted here — rotate and
# rewrite history instead. Keep entries narrow (exact values or single
# directories), never whole file classes like `*_test.go`.

title = "go-atlas"

[extend]
useDefault = true

[allowlist]
description = "Verified synthetic fixtures and documentation placeholders"
paths = [
    # Self-signed test certificates and keys, generated by the committed
    # security/tlsutils/testdata/generate_certs.sh (CN=Test CA, test-only).
    '''security/tlsutils/testdata/.*''',
    # Claude Code tooling artifacts: purged from the tree before release,
    # present only in history; contained documentation examples.
    '''\.claude/.*''',
]
regexes = [
    # Godoc token-format examples in transport/grpc/interceptors/auth/creds_token.go.
    '''sk_live_1234567890abcdef''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
    '''a1b2c3d4-e5f6-7890-abcd-ef1234567890''',
    # Masking-handler test fixture (the test asserts this value IS masked).
    '''sk-1234567890''',
    # Cache/secret-store lookup keys in benchmarks — identifiers, not credentials.
    '''my\.secret-key_123''',
    '''my\.valid-key_1''',
    # Idempotency-key UUID fixture in gRPC interceptor tests.
    '''3b24398f-257d-4879-8ba1-89cb176abe72''',
    # NATS nkey seed from the official nats.io documentation examples,
    # used in config validation tests.
    '''SUACSSL3UAHUDXKFSNVUZRF5UHPMWZ6BFDTJ7M6USDXIEDNPPQYYYCU3VY''',
]

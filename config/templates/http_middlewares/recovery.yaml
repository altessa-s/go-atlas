# Recovery configuration for panic handling and service resilience.
# Catches panics in HTTP handlers and returns 500 status code.
# Critical for preventing service crashes and maintaining system stability.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#recovery:
#  # <bool> Enable panic recovery.
#  # Default value: false
#  enabled: false
#
#  # <list[string]> List of exact URL paths to skip recovery for.
#  # Default value: not set
#  ignorePaths:
#    - "/health"
#
#  # <list[string]> List of regex patterns for URL paths to skip recovery.
#  # Default value: not set
#  ignorePatterns:
#    - "^/health\\..*"
#
#  # <bool> Log the stack trace when a panic occurs.
#  # The config loader replaces an explicit false with this default (true).
#  # Default value: true
#  logStack: true

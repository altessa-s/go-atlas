# Idempotency storage configuration template.
# Storage backend for idempotency keys: memory, redis, nats, mongo or sqldb.
# This file is included via !include directive in idempotency.yaml.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#storage:
#  # <string> Type of storage backend.
#  # Determines which storage system to use for persistence.
#  # Supported values: memory, redis, nats, mongo, sqldb
#  # Default value: not set (required)
#  type: redis
#
#  # <object> In-memory storage configuration.
#  # Contains settings for memory-based storage.
#  # Required when type is set to 'memory'.
#  memory:
#    # <string> Cron schedule for the cleanup task.
#    # Supports standard cron format with seconds: "sec min hour day month weekday"
#    # (e.g., "0 */5 * * * *") or descriptor format (e.g., "@every 5m").
#    # Example: "0 */5 * * * *" (every 5 minutes)
#    # Default value: @every 5m
#    cleanupSchedule: "@every 5m"
#    # <string> Unique cleanup task ID among memory idempotency stores on the same scheduler.
#    # Default value: idempotency-memory-cleanup
#    cleanupTaskID: "idempotency-memory-cleanup"
#
#  # <object> NATS-specific configuration for storage.
#  # Requires JetStream with per-key TTL support (NATS 2.11+).
#  # The bucket TTL retains completed results and caps in-progress leases.
#  # Required when type is set to 'nats'.
#  nats:
#    # <string> Name of the NATS KeyValue bucket.
#    # Bucket name in NATS KeyValue store.
#    # Default value: not set (empty string)
#    bucket: ""
#
#    # <int> Number of replicas for NATS KeyValue storage.
#    # Higher values provide better availability but increase storage overhead.
#    # Must be between 1 and 3.
#    # Default value: 3
#    replicas: 3
#
#    # <bool> Update an existing bucket's key TTL and enable per-key TTL if needed.
#    # Per-key TTL can be enabled even when the bucket's key TTL already matches.
#    # When false, missing per-key TTL or a mismatched bucket TTL fails startup.
#    # Default value: false
#    migrateBucketTTL: false
#
#  # <object> Redis-specific configuration for storage.
#  # Redis-specific settings for key storage.
#  # Required when type is set to 'redis'.
#  redis:
#    # <string> Prefix for all keys in storage.
#    # Namespace prefix to avoid key conflicts.
#    # Default value: not set (empty string)
#    keysPrefix: ""
#
#  # <object> MongoDB-specific configuration for storage.
#  # Keys commit and abort with the caller's MongoDB transaction.
#  # Required when type is set to 'mongo'.
#  mongo:
#    # <string> Collection that stores the idempotency keys.
#    # Default value: idempotency_keys
#    collection: "idempotency_keys"
#
#  # <object> SQL storage configuration (PostgreSQL, MySQL or MariaDB).
#  # Required when type is set to 'sqldb'. Inject *sql.DB with UseSQLDB.
#  sqldb:
#    # <string> SQL dialect: postgres or mysql (includes MariaDB).
#    # Default value: postgres
#    dialect: postgres
#
#    # <string> Table name, optionally schema-qualified.
#    # Default value: idempotency_keys
#    table: idempotency_keys
#
#    # <bool> Create the table and expiry index at startup (30-second timeout).
#    # Leave false when applying the schema through migrations.
#    # Default value: false
#    ensureSchema: false
#
#    # <duration> Time between background purge passes; "0s" disables the loop.
#    # Starts on the first write and stops through factory shutdown hooks.
#    # Default value: 1m
#    purgeInterval: "1m"
#
#    # <int> Maximum rows deleted by one purge statement, at most 65534 (the MySQL placeholder limit).
#    # Default value: 1000
#    purgeBatchSize: 1000

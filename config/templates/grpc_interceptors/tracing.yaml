# Tracing configuration for distributed tracing with OpenTelemetry.
# Controls distributed tracing for gRPC requests using OpenTelemetry.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#tracing:
#  # <bool> Enable distributed tracing.
#  # When enabled, creates spans for gRPC requests.
#  # Default value: false
#  enabled: false
#
#  # <list[string]> List of gRPC methods to skip tracing for.
#  # Methods that should not produce trace spans.
#  # Default value: not set
#  ignoreMethods:
#    - "/grpc.health.v1.Health/Check"
#
#  # <list[string]> List of regex patterns for methods to skip tracing.
#  # Pattern-based rules for tracing bypass.
#  # Default value: not set
#  ignorePatterns:
#    - "^(?i)/grpc.health.*"
#
#  # <bool> Record request/response payloads in trace spans.
#  # Warning: This can significantly increase trace size and may expose sensitive data.
#  # The built-in gRPC server factory does not currently apply this setting.
#  # Default value: false
#  recordPayload: false
#
#  # <bool> Record gRPC metadata as span attributes.
#  # The built-in gRPC server factory does not currently apply this setting.
#  # The config loader replaces an explicit false with this default (true).
#  # Default value: true
#  recordMetadata: true
#
#  # <bool> Record streaming message events in trace spans.
#  # The built-in gRPC server factory does not currently apply this setting.
#  # The config loader replaces an explicit false with this default (true).
#  # Default value: true
#  recordEvents: true
#
#  # <bool> Propagate trace context from incoming requests.
#  # When true, parent spans from incoming requests are linked to server spans.
#  # The built-in gRPC server factory does not currently apply this setting.
#  # The config loader replaces an explicit false with this default (true).
#  # Default value: true
#  propagateContext: true

# Geographic access control configuration for endpoint-level geo-blocking.
# Restricts access to specific gRPC methods based on client geographic location
# (continent, country, region) resolved from the client IP address.
# Requires the realip interceptor to be enabled for proper client IP extraction.
# Requires a GeoResolver to be configured in the server builder.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#geoAcl:
#  # <bool> Enable geographic access control.
#  # Default value: false
#  enabled: false
#
#  # <list[string]> List of gRPC methods to skip geographic access control for.
#  # Default value: not set
#  ignoreMethods:
#    - "/grpc.health.v1.Health/Check"
#
#  # <list[string]> List of regex patterns for methods to skip geographic access control.
#  # Default value: not set
#  ignorePatterns:
#    - "^(?i)/grpc.health.*"
#
#  # <string> Default policy when a location matches neither allow nor deny lists.
#  # "deny" = allowlist mode (deny unless allowed), "allow" = denylist mode (allow unless denied).
#  # Supported values: deny, allow
#  # Default value: deny
#  defaultPolicy: deny
#
#  # <string> Behavior when no valid client IP is available or geo resolver fails.
#  # Determines how to handle requests when the client location cannot be determined.
#  # Supported values: allow, deny, error
#  # Default value: deny
#  fallbackBehavior: deny
#
#  # <object> Default rule applied when no endpoint-specific rule matches.
#  # Useful for setting baseline geographic access across all endpoints. Its endpoints and patterns are ignored.
#  defaultRule:
#    # <list[string]> Continent codes that are allowed (e.g. EU, NA).
#    # Default value: not set
#    allowContinents:
#      - "EU"
#      - "NA"
#
#    # <list[string]> Continent codes that are denied.
#    # Default value: not set
#    denyContinents: []
#
#    # <list[string]> ISO 3166-1 alpha-2 country codes that are allowed.
#    # Default value: not set
#    allowCountries: []
#
#    # <list[string]> ISO 3166-1 alpha-2 country codes that are denied.
#    # Default value: not set
#    denyCountries: []
#
#    # <list[string]> ISO 3166-2 region codes that are allowed (e.g. US-CA).
#    # Default value: not set
#    allowRegions: []
#
#    # <list[string]> ISO 3166-2 region codes that are denied (e.g. US-TX).
#    # Default value: not set
#    denyRegions: []
#
#  # <list[object]> Per-endpoint or per-pattern geographic access control rules.
#  # Each rule can target specific endpoints by name or regex patterns.
#  # Within a rule: deny checks run first (region > country > continent),
#  # then allow checks (region > country > continent), then defaultPolicy applies.
#  # Default value: not set
#  rules:
#    # <list[string]> Exact endpoints the rule applies to.
#    # Default value: not set
#    - endpoints:
#        - "/admin.AdminService/DeleteUser"
#      # <list[string]> Regex patterns of endpoints the rule applies to.
#      # Default value: not set
#      patterns: []
#      # <list[string]> Continent codes that are allowed.
#      # Default value: not set
#      allowContinents: []
#      # <list[string]> Continent codes that are denied.
#      # Default value: not set
#      denyContinents: []
#      # <list[string]> ISO 3166-1 alpha-2 country codes that are allowed.
#      # Default value: not set
#      allowCountries:
#        - "US"
#      # <list[string]> ISO 3166-1 alpha-2 country codes that are denied.
#      # Default value: not set
#      denyCountries: []
#      # <list[string]> ISO 3166-2 region codes that are allowed.
#      # Default value: not set
#      allowRegions:
#        - "US-CA"
#      # <list[string]> ISO 3166-2 region codes that are denied.
#      # Default value: not set
#      denyRegions:
#        - "US-TX"
#
#    - patterns:
#        - "^/internal\\..*"
#      allowCountries:
#        - "US"
#        - "DE"
#      denyCountries:
#        - "RU"
#        - "CN"
#      denyContinents:
#        - "AS"

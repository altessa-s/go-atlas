# Authentication configuration for access control and security.
# Validates authentication tokens and enforces access policies.
# Critical for protecting private APIs and sensitive operations.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#auth:
#  # <bool> Enable authentication.
#  # When enabled, validates authentication tokens for requests.
#  # Default value: false
#  enabled: false
#
#  # <list[string]> List of gRPC methods to skip authentication for.
#  # No methods are exempt by default, including health and reflection.
#  # Example explicit exemption: ["/grpc.health.v1.Health/Check"]
#  # Default value: not set
#  ignoreMethods: []
#
#  # <list[string]> List of regex patterns for methods to skip authentication.
#  # Pattern-based rules for authentication bypass; opt in only for public APIs.
#  # Example: ["(?i)^/api[.]PublicService/"]
#  # Default value: not set
#  ignorePatterns: []

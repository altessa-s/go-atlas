# TLS client configuration template.
# Common TLS settings for client connections (NATS, Vault, MongoDB, etc.).
# This file is included via !include directive in other configuration templates.
# tls:
#  # <string> Path to client TLS/SSL certificate file (.pem format).
#  # Required for client certificate authentication.
#  # Default value: not set
#  certificate:
#
#  # <string> Path to client TLS/SSL private key file (.pem format).
#  # Used with certificate for client authentication.
#  # Default value: not set
#  privateKey:
#
#  # <string> Password to decrypt the private key.
#  # Required if the private key file is encrypted.
#  # Default value: not set
#  privateKeyPassword:
#
#  # <list[string]> Paths to CA certificate bundle files for server verification.
#  # Defaults to system certificate bundle if not specified.
#  # Default value: not set
#  caCerts: []
#
#  # <string> Server name for TLS certificate validation.
#  # Must match the server certificate's subject name.
#  # Default value: not set
#  serverName:
#
#  # <bool> Disables TLS certificate verification.
#  # Using this option is highly discouraged for security reasons.
#  # Even with this true, Normalize() resets it to false unless the
#  # ATLAS_ALLOW_INSECURE_TLS environment variable is also set to "true".
#  # Default value: false
#  skipVerifyServerName: false
#
#  # <string> Gates the residual case where ATLAS_ALLOW_INSECURE_TLS is
#  # set AND skipVerifyServerName: true survived Normalize(). Mirrors the
#  # project-wide safety-mode pattern (plugins.SignatureMode,
#  # oidc.JWKSFailureMode).
#  # Supported values:
#  #   - enforce  -- TLS factory rejects SkipVerify=true at build time
#  #     with factory.ErrInsecureSkipVerifyRejected. Production-safe
#  #     default; an operator who needs to disable verification (lab,
#  #     debugging) must opt in via warn or disabled.
#  #   - warn     -- allows SkipVerify=true but logs a loud warning on
#  #     every CreateClientConfig call. Use during deliberate canary
#  #     windows where downstream isn't yet exposing a trusted CA.
#  #   - disabled -- silently allows SkipVerify=true with no log.
#  #     Intended exclusively for unit/integration tests that wire up
#  #     localhost-only fixtures; using it in any deployable artifact is
#  #     a review blocker.
#  # Default value: enforce
#  skipVerifyMode: enforce

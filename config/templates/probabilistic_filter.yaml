# Probabilistic filter configuration.
# Defines settings for Bloom or Cuckoo filters used for existence checks optimization.
# Multiple filters can be configured for different fields (email, phone, inn, etc.).
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#probabilisticFilter:
#  # <object> Default settings for all filters.
#  # These values are used when not overridden in specific filter configuration.
#  # Filter-specific settings are merged with defaults (filter settings take precedence).
#  defaults:
#    # <object> Default Bloom filter settings.
#    bloom:
#      # <object> Storage backend for the filter.
#      storage:
#        # <string> Storage type.
#        # Supported values: memory, redis
#        # Default value: memory
#        type: memory
#
#      # <float64> Target false positive rate.
#      # Probability of false positive results (0.01 = 1%).
#      # Default value: 0.01
#      falsePositiveRate: 0.01
#
#      # <string> Cron schedule for periodic filter rebuild.
#      # Schedule for rebuilding filter from data source.
#      # Supports standard cron format with seconds: "sec min hour day month weekday"
#      # (e.g., "0 0 * * * *") or descriptor format (e.g., "@every 1h").
#      # Applied by the probfilter factory to filters with a data loader (UseDataLoader): an in-memory filter
#      # gets a process-local cron, a Redis filter a task on the scheduler (UseScheduler).
#      # Default value: 0 0 * * * * (every hour)
#      rebuildCron: "0 0 * * * *"
#
#      # <bool> Rebuild filter on service startup.
#      # When true, filter is populated from data source at start.
#      # Applied by the probfilter factory to filters with a data loader: rebuilt inside Build.
#      # Default value: true
#      rebuildOnStart: true
#
#    # <object> Default Cuckoo filter settings.
#    cuckoo:
#      # <object> Storage backend for the filter.
#      storage:
#        # <string> Storage type.
#        # Supported values: memory, redis
#        # Default value: memory
#        type: memory
#
#      # <int> Fingerprint size in bits.
#      # Affects false positive rate: 8 bits ~ 3%, 12 bits ~ 0.2%, 16 bits ~ 0.01%.
#      # Supported values: 8, 12, 16
#      # The built-in probfilter factory does not currently read this value.
#      # Default value: 12
#      fingerprintSize: 12
#
#      # <float64> Capacity multiplier for auto-rebuild on overflow.
#      # New capacity = current capacity * multiplier.
#      # Must be between 1.1 and 10.0.
#      # The built-in probfilter factory does not currently read this value.
#      # Default value: 2.0
#      capacityMultiplier: 2.0
#
#      # <int64> Maximum capacity limit.
#      # Prevents unbounded growth on repeated overflows.
#      # The built-in probfilter factory does not currently read this value.
#      # Default value: 100000000
#      maxCapacity: 100000000
#
#  # <bool> Skip the startup check that the Redis server of a Redis-backed filter
#  # has no allkeys-* maxmemory-policy (such a policy may evict the filter's keys).
#  # When CONFIG is denied (common on managed Redis) the check only logs a warning.
#  # Default value: false
#  skipEvictionPolicyCheck: false
#
#  # <map[string]object> Named filter configurations.
#  # Each key is the filter name (e.g., email, phone, inn).
#  # Used in code as: probabilisticFilter["email"].mightExist(value)
#  # Optional per-filter values left unset fall back to the defaults section.
#  # Default value: not set
#  filters:
#    # Example: email filter. The map key is the filter name.
#    email:
#      # <string> Type of probabilistic filter to use.
#      # Supported values: bloom, cuckoo
#      # Default value: bloom
#      type: bloom
#
#      # <object> Bloom filter settings. Required when type is bloom.
#      bloom:
#        # <object> Storage backend for the filter.
#        storage:
#          # <string> Storage type.
#          # Supported values: memory, redis
#          # Default value: not set (falls back to probabilisticFilter.defaults.bloom.storage)
#          type: memory
#          # <object> Redis-specific settings. Used when storage is redis.
#          redis:
#            # <string> Prefix for all filter keys.
#            # Default value: not set
#            keysPrefix: "myservice:email"
#
#        # <int64> Expected number of elements the filter is sized for.
#        # Required for a Bloom filter.
#        # Default value: not set
#        expectedItems: 1000000
#
#        # <float64> Target false-positive rate (0.01 = 1%).
#        # Default value: not set (falls back to probabilisticFilter.defaults.bloom.falsePositiveRate)
#        falsePositiveRate: 0.001
#
#        # <string> Cron schedule for periodic filter rebuild.
#        # Applied only with a data loader (UseDataLoader).
#        # Default value: not set (falls back to probabilisticFilter.defaults.bloom.rebuildCron)
#        rebuildCron: "0 0 */2 * * *"
#
#        # <bool> Rebuild the filter on service startup.
#        # Applied only with a data loader (UseDataLoader).
#        # Default value: not set (falls back to probabilisticFilter.defaults.bloom.rebuildOnStart)
#        rebuildOnStart: false
#
#
#      # <object> Cuckoo filter settings. Required when type is cuckoo; an alternative to bloom.
#      cuckoo:
#        # <object> Storage backend for the filter.
#        storage:
#          # <string> Storage type.
#          # Supported values: memory, redis
#          # Default value: not set (falls back to probabilisticFilter.defaults.cuckoo.storage)
#          type: memory
#          # <object> Redis-specific settings. Used when storage is redis.
#          redis:
#            # <string> Prefix for all filter keys.
#            # Default value: not set
#            keysPrefix: "myservice:email"
#
#        # <int64> Initial capacity of the filter.
#        # Required for a Cuckoo filter.
#        # Default value: not set
#        capacity: 500000
#
#        # <int> Fingerprint size in bits.
#        # Supported values: 8, 12, 16
#        # Default value: not set (the built-in probfilter factory does not currently read this per-filter value)
#        fingerprintSize: 12
#
#        # <float64> Capacity multiplier for auto-rebuild on overflow (1.1–10.0).
#        # Default value: not set (the built-in probfilter factory does not currently read this per-filter value)
#        capacityMultiplier: 2.0
#
#        # <int64> Maximum capacity limit.
#        # Default value: not set (the built-in probfilter factory does not currently read this per-filter value)
#        maxCapacity: 100000000
#

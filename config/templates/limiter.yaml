# Rate limiter configuration for the <name> service.
# Defines settings for rate limiting, traffic control and abuse prevention.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#limiter:
#  # <int> Size of the LRU cache for IP-to-settings mappings.
#  # This cache optimizes repeated lookups for the same client IP.
#  # Default value: 1000
#  ipCacheSize: 1000
#
#  # <object> Storage configuration for rate limit counters.
#  # Supports multiple storage backends with provider-specific settings.
#  # Configuration for storing rate limit counters and state.
#  storage:
#    # <string> Type of storage backend for rate limit counters.
#    # Determines which storage system to use for counter persistence.
#    # Supported values: memory, redis, nats
#    # Default value: not set (required)
#    type: redis
#
#    # <object> In-memory storage configuration for rate limiter.
#    # Contains settings for memory-based rate limit counter storage.
#    # Required when type is set to 'memory'.
#    memory:
#      # <string> Cron schedule for the cleanup task.
#      # Supports standard cron format with seconds: "sec min hour day month weekday"
#      # (e.g., "0 */5 * * * *") or descriptor format (e.g., "@every 5m").
#      # Example: "0 */5 * * * *" (every 5 minutes)
#      # Default value: not set
#      cleanupSchedule:
#
#    # <object> NATS-specific configuration for rate limiter storage.
#    # Contains settings for NATS KeyValue bucket and replication.
#    # Required when type is set to 'nats'.
#    nats:
#      # <string> Name of the NATS KeyValue bucket for rate limit counters.
#      # Bucket name in NATS KeyValue store.
#      # Default value: not set (empty string)
#      bucket: ""
#
#      # <int> Number of replicas for NATS KeyValue storage.
#      # Higher values provide better availability but increase storage overhead.
#      # Must be between 1 and 3.
#      # Default value: 3
#      replicas: 3
#
#    # <object> Redis-specific configuration for rate limiter storage.
#    # Redis-specific settings for counter storage.
#    # Required when type is set to 'redis'.
#    redis:
#      # <string> Prefix for all rate limit counter keys in storage.
#      # Namespace prefix to avoid key conflicts.
#      # Default value: not set (empty string)
#      keysPrefix: ""
#
#  # <object> Rate limiting rules configuration.
#  # Defines default and target-specific rate limits.
#  rules:
#    # Default rate limit settings applied when no specific rule matches.
#    # This is a required field containing default rate limits.
#    default:
#      # <int64> Maximum number of requests allowed within the period.
#      # Must be a positive integer greater than 0.
#      # Default value: 1000
#      limit: 1000
#      # <duration> The time window for the limit.
#      # Must be a valid duration string parseable by time.ParseDuration.
#      # Default value: 1h
#      period: "1h"
#
#    # List of specific rate limit rules for different IPs or subnets.
#    # Rules are evaluated in order; the first matching rule is applied.
#    targets:
#      # Example rule for a specific high-traffic IP address.
#      - target: "192.168.1.100"
#        # <int64> Maximum number of requests allowed within the period.
#        limit: 5000
#        # <duration> The time window for the limit.
#        period: "1h"
#
#      # Example rule for an internal subnet with higher limits.
#      - target: "10.0.0.0/8"
#        # <int64> Maximum number of requests allowed within the period.
#        limit: 10000
#        # <duration> The time window for the limit.
#        period: "1h"
#

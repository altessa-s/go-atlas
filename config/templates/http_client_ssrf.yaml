# SSRF (Server-Side Request Forgery) egress policy for transport/http/client.
# Safe-by-default: SSRF protection is ENABLED unless you explicitly disable it.
# When enabled, the client blocks connections to private and local IP addresses
# (RFC1918, loopback, link-local), after DNS resolution and before the TCP
# connection, defeating DNS-rebinding as well as direct private-IP requests.
# Omitting this section entirely leaves protection on.

#ssrf:
#  # <bool> Turn SSRF protection OFF. Omit or set false to keep protection
#  # ENABLED (the strict, safe-by-default posture). Set true only for clients
#  # that must reach arbitrary private addresses and cannot enumerate them via
#  # allowed_cidrs below.
#  # Default value: false (protection enabled)
#  disabled: false
#
#  # <list<string>> CIDR prefixes exempted from SSRF blocking, for known
#  # internal service-to-service targets on private networks. Ignored when
#  # disabled is true.
#  # Default value: not set (no exemptions)
#  allowed_cidrs:
#    - 10.0.1.0/24
#    - 192.168.10.0/24

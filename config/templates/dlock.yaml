# Distributed lock configuration.
# Defines settings for the distributed lock mechanism.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#distributionLock:
#  # <string> Specifies the provider for the distributed lock.
#  # Supported values: nats, mongo, sqldb
#  # Default value: not set (required)
#  provider: nats
#
#  # <object> NATS provider configuration, applicable only if the provider is 'nats'.
#  nats:
#    # <string> Specifies the NATS bucket used for the distributed lock.
#    # Default value: dlock
#    bucket: dlock
#
#    # <string> Storage type of a bucket the provider creates.
#    # memory: a lock lives no longer than its TTL; file keeps the fencing-token sequence across restarts.
#    # An existing bucket keeps its storage type (see the provider README for migrating it).
#    # Supported values: memory, file
#    # Default value: memory
#    storage: memory
#
#    # <bool> Update an existing bucket whose key TTL differs from the lock TTL.
#    # When false, a bucket with a different key TTL is left untouched and the lock
#    # fails to build with ErrBucketTTLMismatch: the bucket's key TTL expires every
#    # lock in it, including locks of other processes sharing the bucket. Enable it
#    # only once every process sharing the bucket uses the same lock TTL.
#    # Default value: false
#    migrateBucketTTL: false
#
#    # <bool> Fail when the bucket already exists with another storage type.
#    # When false, such a bucket is used as is and a warning is logged on every start;
#    # the server cannot convert a bucket's storage type (see the backend's README for
#    # the storage migration).
#    # Default value: false
#    strictBucketStorage: false
#
#  # <object> MongoDB provider configuration, applicable only if the provider is 'mongo'.
#  # The *mongo.Database is injected into the factory (UseMongoDB).
#  mongo:
#    # <string> Collection holding one lease document per lock key.
#    # Default value: dlocks
#    collection: dlocks
#
#    # <duration> Lease of a lock: a holder that stops renewing loses the lock this long
#    # after its last renewal (with withoutRenewal: the whole lease). At least 1ms.
#    # Default value: 10s
#    ttl: "10s"
#
#    # <float64> Fraction of the TTL after which a lease is renewed, in (0, 1).
#    # 0 keeps the provider default (1/3). Ignored with withoutRenewal.
#    # Default value: 0
#    renewRatio: 0
#
#    # <bool> Hard leases: a lease is never renewed and ends one TTL after it was taken,
#    # so the work it guards must finish within the TTL.
#    # Default value: false
#    withoutRenewal: false
#
#    # <bool> Delete a lock document expiredCleanupGrace after its lease ended (TTL index
#    # on expires_at), so the collection does not keep one document per key ever locked.
#    # Fencing tokens are then monotonic only while a key is locked again within the grace.
#    # Default value: false
#    expiredCleanup: false
#
#    # <duration> How long a lock document outlives its lease with expiredCleanup,
#    # rounded up to whole seconds (MongoDB's TTL monitor adds up to about a minute).
#    # Default value: 0s
#    expiredCleanupGrace: "0s"
#
#    # <bool> Create or update the cleanup TTL index (or drop it when expiredCleanup is
#    # off) while building the lock. Leave false when indexes are managed elsewhere;
#    # then call EnsureIndexes on the provider.
#    # Default value: false
#    ensureIndexes: false
#
#  # <object> SQL provider configuration, applicable only if the provider is 'sqldb'.
#  # The *sql.DB is injected into the factory (UseSQLDB); the application chooses
#  # and registers the driver.
#  sqldb:
#    # <string> SQL flavor.
#    # Supported values: postgres (PostgreSQL 12+), mysql (MySQL 8.0+ and MariaDB 10.6+)
#    # Default value: postgres
#    dialect: postgres
#
#    # <string> Table holding one lease row per lock key, optionally schema-qualified.
#    # Default value: dlocks
#    table: dlocks
#
#    # <bool> Create the table while building the lock.
#    # Leave false when the schema is applied through migrations.
#    # Default value: false
#    ensureSchema: false

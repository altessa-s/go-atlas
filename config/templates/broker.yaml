# Message broker configuration.
# Defines settings for message broker operations and provider selection.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#broker:
#  # <string> Specifies the message broker provider to use.
#  # Controls which message broker implementation is used for asynchronous communication.
#  # Supported values: nats
#  # Default value: nats
#  provider: nats
#
#  # <object> NATS configuration.
#  # Required when provider is "nats".
#  # See nats.yaml template for full configuration options.
#  !include nats.yaml
#
#  # <object> InProgress heartbeat manager configuration.
#  # Manages periodic heartbeat sending for long-running message handlers.
#  inProgress:
#    # <bool> Enable InProgress manager.
#    # When false, manager is not created and handlers work without heartbeats.
#    # Default value: true
#    enabled: true
#
#    # <string> Cron schedule for the heartbeat tick cycle.
#    # Uses standard cron format with seconds: "second minute hour day month weekday"
#    # Examples:
#    #   - "*/1 * * * * *" - every second (default)
#    #   - "*/5 * * * * *" - every 5 seconds
#    #   - "0 * * * * *" - every minute
#    # Default value: "*/1 * * * * *"
#    tickSchedule: "*/1 * * * * *"
#
#    # <duration> Default interval for InProgress calls when not specified in Register().
#    # Should be less than broker's AckWait to prevent redelivery.
#    # Recommended: AckWait / 3 (e.g., 10s for AckWait=30s).
#    # Default value: 10s
#    defaultHeartbeatInterval: "10s"
#
#    # <int> Maximum number of registered heartbeaters.
#    # Must be between 1 and 100000.
#    # Default value: 10000
#    maxEntries: 10000
#
#    # <object> Metrics configuration.
#    metrics:
#      # <bool> Enable metrics collection.
#      # Default value: true
#      enabled: true
#
#      # <string> Metric name prefix.
#      # Default value: "inprogress"
#      prefix: "inprogress"
#
#  # <object> Outbox configuration for reliable message delivery.
#  # Manages persistent storage and background publishing of messages.
#  outbox:
#    # <bool> Enable Outbox.
#    # When false, outbox is not created and messages are published directly.
#    # Default value: true
#    enabled: true
#
#    # <string> Cron schedule for the dispatcher.
#    # Supports standard cron format with seconds: "sec min hour day month weekday"
#    # Example: "*/2 * * * * *" (every 2 seconds)
#    # Default value: not set
#    dispatchSchedule:
#
#    # <duration> Timeout for fetching unprocessed events from storage.
#    # Default value: 5s
#    fetchTimeout: "5s"
#
#    # <duration> Timeout for processing a batch of events (publishing + updating status).
#    # Default value: 20s
#    handleTimeout: "20s"
#
#    # <duration> Timeout for updating event status in storage after publishing.
#    # Default value: 5s
#    updateTimeout: "5s"
#
#    # <duration> How long an event may stay locked by a dispatcher before the
#    # unlock task reclaims it. MUST exceed handleTimeout: a lock that expires
#    # while the cycle holding it is still publishing lets a second dispatcher
#    # claim the same event, which makes duplicate delivery the steady state
#    # rather than an edge case. A smaller value is raised at startup with a
#    # warning.
#    # Default value: 40s (2x the default handleTimeout)
#    maxLockTime: "40s"
#
#    # <string> Cron schedule for the cleanup task.
#    # Supports standard cron format with seconds: "sec min hour day month weekday"
#    # Example: "0 */10 * * * *" (every 10 minutes)
#    # Default value: not set
#    cleanupSchedule:
#
#    # <string> Cron schedule for the unlocker task.
#    # Supports standard cron format with seconds: "sec min hour day month weekday"
#    # Example: "*/11 * * * * *" (every 11 seconds)
#    # Default value: not set
#    unlockSchedule:
#
#    # <string> Cron schedule for the expire task, which marks pending and
#    # failed events past their ExpiresAt as expired. Only registered when
#    # defaultEventTTL is set.
#    # Example: "*/11 * * * * *" (every 11 seconds)
#    # Default value: not set
#    expireSchedule:
#
#    # <string> Cron schedule for the stats task, which refreshes the backlog,
#    # dead-letter, and lag gauges (outbox_events_pending,
#    # outbox_events_dead_lettered, outbox_events_oldest_pending_age_seconds).
#    # Leave it unset and those gauges stay at zero — which reads exactly like a
#    # healthy idle outbox, so a stalled one raises no alert.
#    # Example: "@every 30s"
#    # Default value: not set
#    statsSchedule:
#
#    # <uint32> Number of events fetched per batch.
#    # Must be between 1 and 10000.
#    # Default value: 200
#    messagesBatchSize: 200
#
#    # <uint32> Maximum number of publish attempts per event. Each dispatch
#    # cycle spends exactly one attempt; spacing between them comes from the
#    # backoff below. Once the budget runs out the event is dead-lettered as
#    # "max-attempt-reached" and retained for inspection rather than retried
#    # forever.
#    # Must be between 1 and 100.
#    # Default value: 10
#    retryMaxAttempts: 10
#
#    # <duration> Backoff before the second publish attempt. Later attempts back
#    # off exponentially with jitter, and the deadline is stored per event and
#    # evaluated against the database clock — so it survives a restart and is
#    # not affected by a skewed application clock.
#    # Default value: 1s
#    retryBaseDelay: "1s"
#
#    # <duration> Upper bound on the backoff between publish attempts.
#    # Default value: 5m
#    retryMaxDelay: "5m"
#
#    # <int> Maximum accepted payload size in bytes. Larger messages are
#    # rejected at publish time with ErrPayloadTooLarge, inside the caller's
#    # transaction, instead of failing later in the store driver. Messages
#    # approaching the limit belong behind a claim-check: put the blob in object
#    # storage and publish a reference. 0 disables the check.
#    # Default value: 1048576 (1 MiB)
#    maxPayloadBytes: 1048576
#
#    # <duration> How long processed events are retained before cleanup.
#    # -1 means indefinite retention. Dead-lettered events (max-attempt-reached,
#    # rejected) are never swept: they are the dead-letter queue and stay until
#    # an operator acts on them.
#    # Default value: -1
#    publishedEventsLifetime: "-1"
#
#    # <duration> Default time-to-live applied to events without an explicit
#    # ExpiresAt. An expired event is never published. Values below 1s are
#    # ignored. 0 disables expiration.
#    # Default value: 0
#    defaultEventTTL: 0
#
#    # <bool> Enable log compaction behavior for all topics.
#    # If true, only the latest event for each topic in a batch will be published.
#    # Default value: false
#    topicCompaction: false
#
#    # Scheduler task IDs. Override the defaults only when running multiple
#    # Outbox instances against the SAME scheduler — the scheduler upserts
#    # by ID, so two instances both registering "outbox-dispatch" would
#    # silently overwrite each other's dispatch Func pointer. Collisions
#    # across the five IDs are rejected at startup with
#    # outbox.ErrTaskIDCollision, so a typo that aliases two of them is
#    # surfaced before the scheduler ever spins.
#    # Default value: outbox-dispatch
#    dispatchTaskID: outbox-dispatch
#    # Default value: outbox-unlock
#    unlockTaskID: outbox-unlock
#    # Default value: outbox-expire
#    expireTaskID: outbox-expire
#    # Default value: outbox-cleanup
#    cleanupTaskID: outbox-cleanup
#    # Default value: outbox-stats
#    statsTaskID: outbox-stats

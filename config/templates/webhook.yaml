# Webhook signature configuration.
# HMAC signing/verification of webhook bodies (security/hmacsign). Drives the hmacsign factory: a Verifier for inbound
# webhooks or a Signer for outbound ones.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#webhookSignature:
#  # <string> Provider wire format.
#  # Supported values: github (X-Hub-Signature-256), stripe (Stripe-Signature)
#  # Default value: not set
#  scheme: stripe
#
#  # <string> Shared webhook secret. Supports file:/env:/vault: references.
#  # Default value: not set
#  secret: env:WEBHOOK_SECRET
#
#  # <list[string]> Extra secrets the verifier also accepts, for zero-downtime rotation.
#  # Ignored when signing.
#  # Default value: not set
#  additionalSecrets: []
#
#  # <duration> Replay window for a timestamped scheme (Stripe).
#  # An explicit zero is replaced by the default by the config loader.
#  # Default value: 5m
#  tolerance: "5m"

# Mutual-TLS authentication validators configuration.
# The certificate-validation policy consumed by factory/auth/mtls.New(&cfg).Options(). The identity function and
# audit recorder are wired in code; the TLS credentials that require and verify the client certificate are configured
# on the server through github.com/altessa-s/go-tlsutils.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#mtls:
#  # <list[string]> Pin the accepted SPIFFE trust domains.
#  # Required unless allowAnyTrustDomain is true: the factory refuses a configuration that sets neither.
#  # No other setting below replaces this decision.
#  # Each entry is a trust domain name (lower-case letters, digits, '.', '-', '_'); an empty entry is rejected.
#  # Default value: not set
#  trustDomains:
#    - "example.org"
#
#  # <bool> Accept a certificate from any SPIFFE trust domain when trustDomains is empty.
#  # The TLS trust pool is then the whole trust decision: a shared or federated CA can issue an
#  # accepted certificate for a foreign trust domain. Ignored when trustDomains is set.
#  # Needed for certificates without a SPIFFE ID (identity in the DN); pin those with
#  # allowedSubjectCNs, allowedIssuerCNs or issuerKeyIDs.
#  # Default value: false
#  allowAnyTrustDomain: false
#
#  # <bool> Re-validate the certificate validity window on every call
#  # (long-lived connections that outlive their certificate).
#  # Default value: true
#  checkExpiry: true
#
#  # <duration> Clock-skew tolerance for the expiry re-check.
#  # Default value: 30s
#  expiryLeeway: "30s"
#
#  # <list[string]> Accepted certificate Subject CommonNames (classic-PKI pin for identity in the DN).
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedSubjectCNs: []
#
#  # <list[string]> Accepted issuer (CA) CommonNames — narrows chain trust to specific issuers.
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedIssuerCNs: []
#
#  # <list[string]> Accepted issuing-CA Authority Key IDs, hex-encoded — the most robust CA pin.
#  # The check is skipped unless set.
#  # Default value: not set
#  issuerKeyIDs: []
#
#  # <list[string]> Accepted DNS Subject Alternative Names (wildcard SANs honored).
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedDNSNames: []
#
#  # <list[string]> Required extended key usages.
#  # Supported values: clientAuth, serverAuth, any
#  # Default value: not set
#  requiredEKUs: []

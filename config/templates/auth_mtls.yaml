# Mutual-TLS authentication validators — the certificate-validation policy
# consumed by auth/mtls/factory.New(&cfg).Options(). The identity function and
# audit recorder are wired in code; the TLS credentials that require and verify
# the client certificate are configured on the server via security/tlsutils.
mtls:
  # Pin the accepted SPIFFE trust domains. Empty accepts any trust domain.
  trustDomains:
    - "example.org"
  # Re-validate the certificate validity window on every call (long-lived
  # connections that outlive their certificate). Defaults to true.
  checkExpiry: true
  # Clock-skew tolerance for the expiry re-check. Defaults to 30s.
  expiryLeeway: 30s
  # Classic-PKI pins (for identity in the DN rather than a SPIFFE URI). Each is
  # empty by default — the check is skipped unless set.
  # Accepted certificate Subject CommonNames.
  allowedSubjectCNs: []
  # Accepted issuer (CA) CommonNames — narrows chain trust to specific issuers.
  allowedIssuerCNs: []
  # Accepted issuing-CA Authority Key IDs, hex-encoded — the most robust CA pin.
  issuerKeyIDs: []
  # Accepted DNS Subject Alternative Names (wildcard SANs honored).
  allowedDNSNames: []
  # Required extended key usages: clientAuth, serverAuth, any.
  requiredEKUs: []

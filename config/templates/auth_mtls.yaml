# Mutual-TLS authentication validators configuration.
# The certificate-validation policy consumed by auth/mtls/factory.New(&cfg).Options(). The identity function and
# audit recorder are wired in code; the TLS credentials that require and verify the client certificate are configured
# on the server via security/tlsutils.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#mtls:
#  # <list[string]> Pin the accepted SPIFFE trust domains.
#  # Empty accepts any trust domain.
#  # Default value: not set
#  trustDomains:
#    - "example.org"
#
#  # <bool> Re-validate the certificate validity window on every call
#  # (long-lived connections that outlive their certificate).
#  # The config loader replaces an explicit false with this default (true).
#  # Default value: true
#  checkExpiry: true
#
#  # <duration> Clock-skew tolerance for the expiry re-check.
#  # Default value: 30s
#  expiryLeeway: "30s"
#
#  # <list[string]> Accepted certificate Subject CommonNames (classic-PKI pin for identity in the DN).
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedSubjectCNs: []
#
#  # <list[string]> Accepted issuer (CA) CommonNames — narrows chain trust to specific issuers.
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedIssuerCNs: []
#
#  # <list[string]> Accepted issuing-CA Authority Key IDs, hex-encoded — the most robust CA pin.
#  # The check is skipped unless set.
#  # Default value: not set
#  issuerKeyIDs: []
#
#  # <list[string]> Accepted DNS Subject Alternative Names (wildcard SANs honored).
#  # The check is skipped unless set.
#  # Default value: not set
#  allowedDNSNames: []
#
#  # <list[string]> Required extended key usages.
#  # Supported values: clientAuth, serverAuth, any
#  # Default value: not set
#  requiredEKUs: []

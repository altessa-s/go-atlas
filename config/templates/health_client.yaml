# Client health monitoring configuration.
# Configures health tracking for external HTTP (httpHealthClient) and gRPC (grpcHealthClient) service clients;
# both sections can be used in the same application. See health_client_http.yaml and health_client_grpc.yaml for
# the per-transport templates.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#httpHealthClient:
#  # <string> Service name registered with the health coordinator.
#  # This name appears in health status reports and metrics. Required.
#  # Default value: not set (required)
#  serviceName: "external-api"
#
#  # <duration> Sliding window duration for calculating retry rates.
#  # Health status degrades when retry rate exceeds threshold within this window.
#  # Default value: 60s
#  retryWindow: "60s"
#
#  # <float64> Maximum acceptable retry rate (0.0-1.0).
#  # When exceeded, the service health status changes to DEGRADED.
#  # Default value: 0.2 (20% retry rate)
#  retryThreshold: 0.2
#
#  # <uint64> Minimum number of requests in the window before retry rate affects health status.
#  # Prevents false positives from low traffic periods.
#  # Default value: 10
#  retryMinSamples: 10
#
#  # <int> Number of buckets in the sliding window.
#  # More buckets provide finer granularity at the cost of memory.
#  # Default value: 60
#  retryBuckets: 60
#
#  # <bool> Enable per-host health checks.
#  # When true, registers separate health checkers for each configured host.
#  # Only applies to clients with explicit per-host circuit breaker settings.
#  # Default value: false
#  perHost: false
#
#  # Example: aggressive monitoring for a payment gateway —
#  #   serviceName: "payment-gateway", retryWindow: "30s", retryThreshold: 0.1,
#  #   retryMinSamples: 20, retryBuckets: 30, perHost: true

#grpcHealthClient:
#  # <string> Service name registered with the health coordinator.
#  # This name appears in health status reports and metrics. Required.
#  # Default value: not set (required)
#  serviceName: "user-service"
#
#  # <string> Mapping strategy from gRPC connection state to health status.
#  # Supported values:
#  #   - default: standard mapping from connectivity.State to ServingStatus
#  #   - strict: any non-READY state maps to NOT_SERVING
#  #   - lenient: CONNECTING/IDLE map to SERVING, only TRANSIENT_FAILURE/SHUTDOWN to NOT_SERVING
#  # Default value: default
#  stateMapper: "default"
#
#  # <bool> Enable per-target health checks for connection pools.
#  # When true, registers separate health checkers for each target address.
#  # Default value: false
#  perTarget: false
#
#  # Examples:
#  #   strict checking for a critical dependency: stateMapper: "strict"
#  #   a connection pool monitored per target: perTarget: true
#  #   a resilient background worker: stateMapper: "lenient"

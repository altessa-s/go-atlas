# Client health monitoring configuration.
# Configure health tracking for external HTTP and gRPC service clients.
# All parameters are commented out by default (template mode).
# Uncomment and configure the appropriate section for your client type.

# ==============================================================================
# HTTP CLIENT HEALTH MONITORING
# ==============================================================================
# Tracks HTTP client health based on retry rates and circuit breaker state.

#httpHealthClient:
#  # <string> Service name registered with the health coordinator.
#  # This name appears in health status reports and metrics.
#  # REQUIRED field - must be set.
#  serviceName: "external-api"
#
#  # <duration> Sliding window duration for calculating retry rates.
#  # Health status degrades when retry rate exceeds threshold within this window.
#  # Default value: 60s
#  retryWindow: "60s"
#
#  # <float64> Maximum acceptable retry rate (0.0-1.0).
#  # When exceeded, the service health status changes to DEGRADED.
#  # Default value: 0.2 (20% retry rate)
#  retryThreshold: 0.2
#
#  # <uint64> Minimum number of requests in the window before retry rate affects health status.
#  # Prevents false positives from low traffic periods.
#  # Default value: 10
#  retryMinSamples: 10
#
#  # <int> Number of buckets in the sliding window.
#  # More buckets provide finer granularity at the cost of memory.
#  # Default value: 60
#  retryBuckets: 60
#
#  # <bool> Enable per-host health checks.
#  # When true, registers separate health checkers for each configured host.
#  # Only applies to clients with explicit per-host circuit breaker settings.
#  # Default value: false
#  perHost: false

# ==============================================================================
# GRPC CLIENT HEALTH MONITORING
# ==============================================================================
# Tracks gRPC client health based on connection state.

#grpcHealthClient:
#  # <string> Service name registered with the health coordinator.
#  # This name appears in health status reports and metrics.
#  # REQUIRED field - must be set.
#  serviceName: "user-service"
#
#  # <string> Mapping strategy from gRPC connection state to health status.
#  # Available options:
#  #   - "default": Standard mapping from connectivity.State to ServingStatus
#  #   - "strict": Any non-READY state maps to NOT_SERVING
#  #   - "lenient": CONNECTING/IDLE map to SERVING, only TRANSIENT_FAILURE/SHUTDOWN to NOT_SERVING
#  # Default value: "default"
#  stateMapper: "default"
#
#  # <bool> Enable per-target health checks for connection pools.
#  # When true, registers separate health checkers for each target address.
#  # Default value: false
#  perTarget: false

# ==============================================================================
# USAGE EXAMPLES
# ==============================================================================

# Example 1: HTTP client with aggressive health monitoring
# httpHealthClient:
#   serviceName: "payment-gateway"
#   retryWindow: "30s"          # Shorter window for faster detection
#   retryThreshold: 0.1          # Lower threshold (10% retry rate)
#   retryMinSamples: 20          # Higher sample requirement
#   retryBuckets: 30
#   perHost: true                # Monitor each host separately

# Example 2: gRPC client with strict health requirements
# grpcHealthClient:
#   serviceName: "auth-service"
#   stateMapper: "strict"        # Any non-READY state is unhealthy
#   perTarget: false             # Single health status for all targets

# Example 3: Both HTTP and gRPC clients in the same application
# httpHealthClient:
#   serviceName: "external-api"
#   retryWindow: "60s"
#   retryThreshold: 0.2
#
# grpcHealthClient:
#   serviceName: "internal-service"
#   stateMapper: "default"
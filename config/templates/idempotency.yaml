# Idempotency configuration for the <name> service.
# Defines settings for idempotency key management and storage.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#idempotency:
#  # <duration> TTL for idempotency keys in storage.
#  # How long idempotency records are kept.
#  # Default value: 24h
#  ttl: 24h
#
#  # <object> Storage configuration for idempotency keys.
#  # Supports multiple storage backends with provider-specific settings.
#  # Configuration for storing idempotency keys and results.
#  storage:
#    # <string> Type of storage backend for idempotency keys.
#    # Determines which storage system to use for persistence.
#    # Supported values: memory, redis, nats
#    # Default value: not set (required)
#    type: redis
#
#    # <object> In-memory storage configuration for idempotency.
#    # Contains settings for memory-based idempotency key storage.
#    # Required when type is set to 'memory'.
#    memory:
#      # <string> Cron schedule for the cleanup task.
#      # Supports standard cron format with seconds: "sec min hour day month weekday"
#      # (e.g., "0 */5 * * * *") or descriptor format (e.g., "@every 5m").
#      # Example: "0 */5 * * * *" (every 5 minutes)
#      # Default value: not set
#      cleanupSchedule:
#
#    # <object> NATS-specific configuration for idempotency storage.
#    # Contains settings for NATS KeyValue bucket and replication.
#    # Required when type is set to 'nats'.
#    nats:
#      # <string> Name of the NATS KeyValue bucket for idempotency keys.
#      # Bucket name in NATS KeyValue store.
#      # Default value: not set (empty string)
#      bucket: ""
#
#      # <int> Number of replicas for NATS KeyValue storage.
#      # Higher values provide better availability but increase storage overhead.
#      # Must be between 1 and 3.
#      # Default value: 3
#      replicas: 3
#
#    # <object> Redis-specific configuration for idempotency storage.
#    # Redis-specific settings for key storage.
#    # Required when type is set to 'redis'.
#    redis:
#      # <string> Prefix for all idempotency keys in storage.
#      # Namespace prefix to avoid key conflicts.
#      # Default value: not set (empty string)
#      keysPrefix: ""
#

# Budget limiter configuration.
# Enforces a fixed request budget within a configurable time period
# using a shared storage backend for consistent enforcement across replicas.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#budgetLimiter:
#  # <int64> Maximum number of requests allowed within the period.
#  # Must be a positive integer greater than 0.
#  # Default value: not set (required)
#  limit: 10000
#
#  # <duration> The time window for the budget counter.
#  # Must be a valid duration string parseable by time.ParseDuration.
#  # Default value: 24h
#  period: "24h"
#
#  # <bool> Allow memory storage to evict live windows at capacity.
#  # Fail-open risk: key churn can reset a quota before its window expires.
#  # Default value: false
#  insecureEvictLRU: false
#
#  # <object> Storage configuration for budget counters.
#  # Supports multiple storage backends with provider-specific settings.
#  !include storage_backend.yaml
#
#  # <object> Compare-and-swap retry tuning for the NATS storage; ignored by other storages.
#  # Default value: not set (storage defaults apply)
#  natsContention:
#    # <int> Read-modify-write attempts per check before it fails with a contention error.
#    # Default value: 64
#    maxCASAttempts: 64
#
#    # <duration> Ceiling of the randomized pause after a revision conflict.
#    # Default value: 20ms
#    maxCASBackoff: "20ms"

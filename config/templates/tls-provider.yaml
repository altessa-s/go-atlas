# TLS provider configuration for the <name> service.
# Defines settings for various TLS certificate providers for secure communication.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#tlsProvider:
#  # <object> File-based TLS certificate provider configuration.
#  # Uses certificate and private key files from the local filesystem.
#  file:
#    # <string> Path to TLS/SSL certificate file (.pem format).
#    # Contains the public certificate for TLS communication.
#    # Default value: not set (required for file provider)
#    certificate:
#
#    # <string> Path to TLS/SSL private key file (.pem format).
#    # Contains the private key corresponding to the certificate.
#    # Default value: not set (required for file provider)
#    privateKey:
#
#    # <string> Password to decrypt the private key.
#    # Required if the private key file is encrypted.
#    # Default value: not set
#    privateKeyPassword:
#
#  # <object> HashiCorp Vault PKI certificate provider configuration.
#  # Dynamically issues and renews certificates using Vault's PKI engine.
#  vault:
#    # <string> Certificate common name (CN) for the issued certificate.
#    # Primary domain name or identifier for the certificate.
#    # Default value: not set (required for vault provider)
#    commonName:
#
#    # <string> Vault role to use when issuing certificates.
#    # Must be configured in Vault PKI engine with appropriate permissions.
#    # Default value: not set (required for vault provider)
#    role:
#
#    # <duration> How early certificates should be renewed before expiration.
#    # Ensures certificates are renewed with sufficient time buffer.
#    # Default value: 30m
#    renewBefore: 30m
#
#    # <list[string]> Additional DNS Subject Alternative Names.
#    # Extra domain names for the certificate.
#    # Default value: not set
#    subjectAlternativeNames:
#
#    # <list[string]> Additional IP Address Subject Alternative Names.
#    # Extra IP addresses that should be valid for the certificate.
#    # Default value: not set
#    ipSubjectAlternativeNames:
#
#  # <object> Let's Encrypt ACME certificate provider configuration.
#  # Automatically obtains and renews free SSL certificates from Let's Encrypt.
#  letsencrypt:
#    # <string> Contact email address for Let's Encrypt notifications.
#    # Used to notify about certificate problems and expiration.
#    # Default value: not set (required for letsencrypt provider)
#    email:
#
#    # <list[string]> Domain names for which the certificate should be issued.
#    # First domain becomes the common name. Must be publicly accessible domain names.
#    # Default value: not set (required for letsencrypt provider)
#    domain: []
#
#    # <duration> How early certificates should be renewed before expiration.
#    # Let's Encrypt certificates are valid for 90 days.
#    # Default value: 30m
#    renewBefore: 30m
#
#    # <bool> Whether to start internal server for ACME HTTP challenge.
#    # Required for HTTP-01 challenge validation.
#    # Default value: false
#    startInternalServer: false
#
#    # <string> Address for the internal ACME challenge server.
#    # Only used if startInternalServer is true.
#    # Default value: 0.0.0.0:8080
#    listenAddress: "0.0.0.0:8080"

# Secrets management configuration for the <name> service.
# Defines settings for secrets storage providers and cache management.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#secrets:
#  # <string> Specifies the secrets storage provider to use.
#  # Controls which backend is used for secret retrieval and storage.
#  # Supported values: memory, vault, gcp, lockbox
#  # Default value: memory
#  provider: memory
#
#  # <string> Cron schedule for cache synchronization with storage backend.
#  # Supports standard cron format with seconds: "sec min hour day month weekday"
#  # (e.g., "0 */5 * * * *") or descriptor format (e.g., "@every 5m").
#  # Examples:
#  #   "0 */5 * * * *"  - every 5 minutes
#  #   "0 0 * * * *"    - every hour
#  #   "0 0 */6 * * *"  - every 6 hours
#  #   "@every 5m"      - every 5 minutes (descriptor format)
#  # Default value: "0 */5 * * * *"
#  updateSchedule: "0 */5 * * * *"
#
#  # <bool> Trigger an immediate cache sync when the manager starts.
#  # Ensures cache is populated before handling requests.
#  # Default value: true
#  runOnStart: true
#
#  # <object> Cache configuration for secrets manager.
#  cache:
#    # <int> Maximum number of secrets to cache.
#    # Older entries are evicted when limit is reached (LRU).
#    # 0 means use default (1000).
#    # Default value: 1000
#    maxSize: 1000
#
#    # <int> Number of shards for sharded cache.
#    # 0 means use standard (non-sharded) cache.
#    # Sharded cache provides better concurrency for high-throughput scenarios.
#    # Recommended: 16-64 for production workloads.
#    # Default value: 0
#    shardCount: 0
#
#  # <object> Retry configuration for storage operations.
#  retry:
#    # <int> Maximum number of retry attempts for failed operations.
#    # 0 means no retries.
#    # Default value: 3
#    maxAttempts: 3
#
#    # <duration> Initial delay between retry attempts.
#    # Default value: 1s
#    baseDelay: "1s"
#
#    # <duration> Maximum delay between retry attempts.
#    # Delay increases exponentially up to this limit.
#    # Default value: 1m
#    maxDelay: "1m"
#
#    # <float64> Exponential backoff multiplier.
#    # Delay is multiplied by this factor after each retry.
#    # Default value: 2.0
#    multiplier: 2.0
#
#  # <object> HashiCorp Vault provider configuration.
#  # Required when provider is "vault".
#  # Note: Vault connection settings are in vault.yaml
#  vault:
#    # <string> Mount path for Vault KV v2 engine.
#    # Path where the KV secrets engine is mounted.
#    # Default value: kv
#    mountPath: kv
#
#    # <string> Base path for secrets within the KV engine.
#    # All secrets will be stored under this path.
#    # Default value: blitz
#    secretPath: blitz
#
#    # <bool> Enable Check-and-Set for atomic updates.
#    # Prevents concurrent modification conflicts.
#    # Default value: false
#    cas: false
#
#  # <object> Google Cloud Secret Manager provider configuration.
#  # Required when provider is "gcp".
#  gcp:
#    # <string> GCP project ID.
#    # The project where secrets are stored.
#    # Default value: not set (required)
#    projectId: ""
#
#    # <string> Path to service account JSON key file.
#    # Service account must have Secret Manager access.
#    # Default value: not set (required)
#    serviceAccountPath: ""
#
#    # <map[string,string]> Labels to filter secrets.
#    # Only secrets with matching labels will be loaded.
#    # Default value: not set (all secrets)
#    labels:
#      env: production
#      app: myservice
#
#    # <bool> Skip keys that fail to decode.
#    # When true, invalid keys are skipped instead of causing errors.
#    # Default value: false
#    ignoreInvalidKeys: false
#
#  # <object> Yandex Cloud Lockbox provider configuration.
#  # Required when provider is "lockbox".
#  lockbox:
#    # <string> Yandex Cloud folder ID.
#    # The folder where secrets are stored.
#    # Default value: not set (required)
#    folderId: ""
#
#    # <string> Service account key ID.
#    # Key ID from the service account.
#    # Default value: not set (required)
#    keyId: ""
#
#    # <string> Service account ID.
#    # The service account used for authentication.
#    # Default value: not set (required)
#    serviceKeyId: ""
#
#    # <string> Path to private key PEM file.
#    # Private key for service account authentication.
#    # Default value: not set (required)
#    privateKeyPath: ""
#
#    # <map[string,string]> Labels to filter secrets.
#    # Only secrets with matching labels will be loaded.
#    # Default value: not set (all secrets)
#    labels:
#      env: production
#      app: myservice
#
#    # <bool> Skip keys that fail to decode.
#    # When true, invalid keys are skipped instead of causing errors.
#    # Default value: false
#    ignoreInvalidKeys: false
# Audit subsystem configuration.
# Controls how audit events are buffered, dispatched, and persisted.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#audit:
#  # <bool> Enable auditing.
#  # When false, the factory returns nil and no auditor is created.
#  # Default value: true
#  enabled: true
#
#  # <object> Storage backend for audit events.
#  storage:
#    # <string> Storage backend type.
#    # Supported values: memory, mongo, clickhouse, sqldb
#    # Omit to fall back to the bounded in-memory ring buffer (logs a startup warning).
#    # Default value: not set (falls back to memory)
#    type:
#
#    # <object> Bounded in-memory ring buffer configuration.
#    # Optional when type is omitted or "memory"; oldest events are evicted when full.
#    memory:
#      # <int> Maximum number of audit events retained in memory before evicting the oldest.
#      # Default value: 10000
#      maxEvents: 10000
#
#    # <object> MongoDB-specific storage configuration.
#    # Required when type is "mongo".
#    mongo:
#      # <string> MongoDB collection name for audit events.
#      # Default value: audit_events
#      collectionName: audit_events
#
#      # <duration> Timeout for index creation operations.
#      # Default value: 30s
#      indexTimeout: "30s"
#
#      # <duration> Time-to-live for audit events. Zero means no expiration.
#      # Default value: 0s (disabled)
#      ttl: "0s"
#
#    # <object> ClickHouse-specific storage configuration.
#    # Required when type is "clickhouse". The connection comes from
#    # factory/infrastructure/clickhouse (UseClickHouseConn).
#    clickhouse:
#      # <string> Table holding audit events.
#      # Default value: audit_events
#      tableName: audit_events
#
#      # <string> Table engine used when the table is created.
#      # Default value: ReplacingMergeTree
#      engine: ReplacingMergeTree
#
#      # <string> ON CLUSTER name for the table DDL; pair with a Replicated* engine.
#      # Default value: not set
#      cluster: ""
#
#      # <duration> Retention period; applied only when the table is created.
#      # Default value: 0s (disabled)
#      ttl: "0s"
#
#      # <int> Largest number of rows sent in a single INSERT.
#      # Default value: 10000
#      maxBatchSize: 10000
#
#      # <duration> Bound on each startup schema operation (create, check).
#      # Default value: 30s
#      ddlTimeout: "30s"
#
#      # <bool> Create the table on startup.
#      # Default value: false
#      autoCreateTable: false
#
#      # <bool> Read with FINAL to observe the deduplicated view.
#      # Default value: false
#      final: false
#
#      # <string> Reaction to a query without a time range.
#      # Supported values: enforce, warn, disabled
#      # Default value: warn
#      timeRangeMode: warn
#
#      # <string> Reaction to a table that drifted from the expected schema.
#      # Supported values: enforce, warn, disabled
#      # Default value: warn
#      schemaCheckMode: warn
#
#    # <object> SQL-specific storage configuration (audit/storages/sqldb).
#    # Required when type is "sqldb". The *sql.DB is injected into the factory
#    # (UseSQLDB); the application chooses and registers the driver.
#    sqldb:
#      # <string> SQL flavor.
#      # Supported values: postgres (PostgreSQL 12+), mysql (MySQL 8.0+ and MariaDB 10.6+)
#      # Default value: postgres
#      dialect: postgres
#
#      # <string> Table holding audit events, optionally schema-qualified.
#      # Default value: audit_events
#      tableName: audit_events
#
#      # <int> Largest number of rows sent in a single INSERT; a larger batch is
#      # split into INSERTs of one transaction.
#      # Default value: 500
#      maxBatchRows: 500
#
#      # <duration> Event retention. Zero keeps events forever, as with mongo.ttl.
#      # Positive values enable batched background purges every minute while open.
#      # Default value: 0s
#      ttl: "0s"
#
#      # <duration> Time between background purge passes; "0s" disables the loop.
#      # Inactive until retention is enabled.
#      # Default value: 1m
#      purgeInterval: "1m"
#
#      # <int> Maximum rows deleted by one purge statement.
#      # Default value: 1000
#      purgeBatchSize: 1000
#
#      # <bool> Create the table and its indexes on startup.
#      # Off by default: schema changes belong in a migration.
#      # Default value: false
#      ensureSchema: false
#
#  # <object> Signed page tokens for querying events. Omit to return single pages.
#  # See paging.yaml for full configuration options.
#  !include paging.yaml
#
#  # <duration> Maximum time to wait during graceful shutdown.
#  # Default value: 30s
#  shutdownTimeout: "30s"
#
#  # <object> Async dispatch engine configuration.
#  # See dispatch.yaml for full configuration options.
#  !include dispatch.yaml

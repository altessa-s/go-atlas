# Scheduler configuration.
# Defines settings for the task scheduler including tick interval, history retention, and concurrency.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#scheduler:
#  # <duration> Interval for the scheduler loop to check for tasks.
#  # How often the scheduler checks for pending tasks to execute.
#  # Default value: 1s
#  tickInterval: "1s"
#
#  # <duration> Duration to keep task history before cleanup.
#  # How long task execution history is retained.
#  # Default value: 168h (7 days)
#  historyRetention: "168h"
#
#  # <object> Concurrency configuration for the scheduler.
#  # Controls how the scheduler determines the number of concurrent tasks.
#  concurrency:
#    # <string> Concurrency strategy.
#    # Determines how the concurrency limit is calculated.
#    # Supported values: static, environment, memory-aware, adaptive
#    # Default value: static
#    strategy: static
#
#    # <int> Maximum number of tasks that can run concurrently.
#    # Zero means unlimited. Used with the "static" strategy.
#    # Default value: 5
#    maxTasks: 5
#
#    # <int> Number of concurrency slots reserved for high priority tasks.
#    # These slots cannot be used by normal/low priority tasks.
#    # Applies to all strategies.
#    # Default value: 2
#    reservedHighPrioritySlots: 2
#
#    # <string> Environment preset for concurrency.
#    # Used when strategy is "environment".
#    # Supported values: memory-constrained, cpu-bound, io-bound, high-throughput, rate-limited
#    # Default value: io-bound
#    environment: io-bound
#
#    # <object> Memory-aware concurrency configuration.
#    # Required when strategy is "memory-aware".
#    memoryAware:
#      # <uint64> Memory threshold (MB) below which concurrency is set to 1.
#      # Required when strategy is "memory-aware".
#      # Default value: not set
#      lowMemoryMB: 256
#
#      # <uint64> Memory threshold (MB) below which concurrency is conservative.
#      # Required when strategy is "memory-aware".
#      # Default value: not set
#      mediumMemoryMB: 512
#
#      # <uint64> Memory threshold (MB) above which concurrency is aggressive.
#      # Required when strategy is "memory-aware".
#      # Default value: not set
#      highMemoryMB: 1024
#
#    # <object> Adaptive concurrency configuration.
#    # Required when strategy is "adaptive".
#    adaptive:
#      # <uint64> Available-memory threshold (MB) below which concurrency drops to 25%.
#      # Default value: not set
#      memoryLowThresholdMB: 256
#
#      # <uint64> Available-memory threshold (MB) below which concurrency drops to 50%.
#      # Default value: not set
#      memoryMediumThresholdMB: 512
#
#      # <float64> System load above which concurrency is scaled down.
#      # Default value: not set
#      highLoadThreshold: 0.8
#
#  # <duration> Lease of a task run (minimum 5s), renewed every third of it while the run executes.
#  # A run whose lease has expired (its instance crashed or lost the storage) is reset to Active
#  # on startup and periodically; runs of live instances are never reset.
#  # Default value: 30m
#  staleTaskTimeout: "30m"
#
#  # <string> Identifier of this scheduler instance, stamped on every task run it executes.
#  # Must be unique among the instances sharing one storage. A stable value (e.g. the pod name)
#  # lets a restarted instance recover its own interrupted runs immediately instead of waiting
#  # for their leases (staleTaskTimeout) to expire. Maximum length: 128.
#  # Default value: not set (a random ID per process)
#  instanceID: "scheduler-0"
#
#  # <object> Storage backend configuration for the scheduler.
#  # Supports multiple storage backends with provider-specific settings.
#  # If not set, defaults to in-memory storage.
#  storage:
#    # <string> Type of storage backend for scheduler data.
#    # Determines which storage system to use for task persistence.
#    # Supported values: mongo, redis, memory, sqldb
#    # Default value: memory
#    type: memory
#
#    # <object> MongoDB-specific configuration for scheduler storage.
#    # Contains settings for MongoDB collections.
#    # Required when type is set to 'mongo'.
#    mongo:
#      # <string> MongoDB collection name for task states.
#      # Collection where scheduled tasks are stored.
#      # Default value: scheduler_tasks
#      tasksCollection: scheduler_tasks
#
#      # <string> MongoDB collection name for task history.
#      # Collection where task execution history is stored.
#      # Default value: scheduler_history
#      historyCollection: scheduler_history
#
#      # <bool> Create the task and history indexes while building the
#      # scheduler, through the storage's idempotent EnsureIndexes. Leave
#      # false when the indexes are provisioned separately.
#      # Default value: false
#      ensureIndexes: false
#
#    # <object> Redis-specific configuration for scheduler storage.
#    # Contains settings for Redis keys and history management.
#    # Required when type is set to 'redis'.
#    redis:
#      # <string> Redis key prefix for scheduler data.
#      # Namespace prefix to avoid key conflicts.
#      # Default value: scheduler
#      keyPrefix: scheduler
#
#      # <duration> TTL for history entries in Redis.
#      # Set to 0 to disable TTL (history cleaned by CleanupHistory only).
#      # Default value: 0s (disabled)
#      historyTTL: "0s"
#
#      # <int> Maximum number of history entries kept per task.
#      # Limits history storage per individual task.
#      # Default value: 1000
#      maxHistoryPerTask: 1000
#
#      # <bool> Create the RediSearch indexes (and backfill task documents
#      # written by an earlier release) while building the scheduler, through
#      # the storage's idempotent EnsureIndexes. Leave false when the indexes
#      # are provisioned separately.
#      # Default value: false
#      ensureIndexes: false
#
#    # <object> In-memory storage configuration for scheduler.
#    # Contains settings for memory-based task storage.
#    # Optional when type is set to 'memory'.
#    memory:
#      # <int> Maximum number of history entries kept per task.
#      # Limits history storage per individual task.
#      # Default value: 1000
#      maxHistoryPerTask: 1000
#
#    # <object> SQL database configuration for scheduler storage.
#    # The *sql.DB is injected into the factory (UseSQLDB); the application
#    # chooses and registers the driver. The factory runs DDL only with
#    # ensureSchema: true; otherwise create the schema before starting the
#    # scheduler — EnsureSchema on a sqldb storage built from the same handle,
#    # dialect and table names, or its DDL applied through migrations.
#    # Required when type is set to 'sqldb'.
#    sqldb:
#      # <string> SQL dialect.
#      # Supported values: postgres (PostgreSQL 12+), mysql (MySQL 8.0+ and MariaDB 10.6+)
#      # Default value: postgres
#      dialect: postgres
#
#      # <string> Table name for task states, optionally schema-qualified.
#      # Default value: scheduler_tasks
#      tasksTable: scheduler_tasks
#
#      # <string> Table name for task execution history, optionally schema-qualified.
#      # Default value: scheduler_history
#      historyTable: scheduler_history
#
#      # <bool> Create the tables and indexes (and upgrade a tasks table from
#      # an earlier release) while building the scheduler, through the
#      # storage's idempotent EnsureSchema. Leave false when migrations own
#      # the schema.
#      # Default value: false
#      ensureSchema: false
#
#  # <object> Separate storage for task execution history.
#  # Moves history out of `storage` into a backend suited to an append-only log;
#  # task state stays in `storage`. If not set, history is kept in `storage`.
#  historyStorage:
#    # <string> Type of the history backend.
#    # Supported values: clickhouse
#    # Default value: not set
#    type: clickhouse
#
#    # <object> ClickHouse-specific configuration for the history storage.
#    # The connection is injected into the factory (UseClickHouseConn).
#    # Required when type is set to 'clickhouse'.
#    clickhouse:
#      # <string> Table name for task execution history, a plain identifier.
#      # Default value: scheduler_history
#      tableName: scheduler_history
#
#      # <string> Table engine used when the table is created (MergeTree family).
#      # Default value: MergeTree
#      engine: MergeTree
#
#      # <string> Adds ON CLUSTER to the table DDL and to history deletes.
#      # Pair it with a Replicated* engine.
#      # Default value: not set (single-node table)
#      cluster: ""
#
#      # <duration> Table TTL after the end of a run. It replaces the periodic
#      # cleanup as the retention; applied only when the table is created.
#      # Default value: 0s (historyRetention)
#      ttl: "0s"
#
#      # <bool> Create the table while building the scheduler, through the
#      # storage's EnsureSchema. Leave false when migrations own the schema.
#      # Default value: false
#      ensureSchema: false

# Saga orchestrator configuration.
# Defines settings for the saga engine (data/saga): state-store backend plus
# step/compensation timeouts, retries, and the background recovery cycle.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#saga:
#  # <object> State-store backend that persists saga instances.
#  # Each backend has its own nested section; only the one named by 'type' is used.
#  storage:
#    # <string> Storage backend type.
#    # Supported values: memory, nats, mongo, redis, sqldb
#    # Default value: memory
#    type: memory
#
#    # <object> In-process storage configuration (data/saga/storages/memory).
#    # The backend has no tunables; the section exists for symmetry.
#    # Used when type is set to 'memory'.
#    memory: {}
#
#    # <object> NATS JetStream KeyValue storage configuration
#    # (data/saga/storages/nats). Used when type is set to 'nats'.
#    nats:
#      # <string> Name of the NATS KeyValue bucket.
#      # Default value: saga
#      bucket: saga
#
#      # <duration> Per-key expiry applied to the bucket (NATS KV MaxAge). It must
#      # outlive any saga's running time; zero is widened to a 30-day backstop by
#      # the store.
#      # Default value: 720h (30 days)
#      maxAge: "720h"
#
#      # <bool> Update an existing bucket whose key TTL differs from max_age.
#      # When false, such a bucket is left untouched and the store fails to build
#      # with ErrBucketTTLMismatch: the bucket's key TTL expires every instance in
#      # it, including those of other processes sharing the bucket.
#      # Default value: false
#      migrateBucketTTL: false
#
#      # <bool> Fail when the bucket already exists with another storage type.
#      # When false, such a bucket is used as is and a warning is logged on every start;
#      # the server cannot convert a bucket's storage type (see the backend's README for
#      # the storage migration).
#      # Default value: false
#      strictBucketStorage: false
#
#    # <object> MongoDB storage configuration (data/saga/storages/mongo).
#    # Used when type is set to 'mongo'.
#    mongo:
#      # <string> Collection that stores saga instances.
#      # Default value: saga_instances
#      collection: saga_instances
#
#    # <object> Redis storage configuration (data/saga/storages/redis).
#    # Used when type is set to 'redis'.
#    redis:
#      # <string> Prefix prepended to every Redis key.
#      # Default value: saga:
#      keysPrefix: "saga:"
#
#      # <duration> Per-key expiry applied on every write; zero persists forever.
#      # Default value: 0s (persist)
#      ttl: "0s"
#
#    # <object> SQL storage configuration (data/saga/storages/sqldb).
#    # The *sql.DB is injected into the factory (UseSQLDB); the application
#    # chooses and registers the driver.
#    # Used when type is set to 'sqldb'.
#    sqldb:
#      # <string> SQL flavor.
#      # Supported values: postgres (PostgreSQL 12+), mysql (MySQL 8.0+ and MariaDB 10.6+)
#      # Default value: postgres
#      dialect: postgres
#
#      # <string> Table that stores saga instances, optionally schema-qualified.
#      # Default value: saga_instances
#      table: saga_instances
#
#      # <bool> Create the table and its indexes while building the orchestrator.
#      # Leave false when the schema is applied through migrations.
#      # Default value: false
#      ensureSchema: false
#
#  # <duration> Per-step timeout for a single action or compensation invocation.
#  # Default value: 30s
#  stepTimeout: "30s"
#
#  # <duration> Upper bound for one Start/Resume ownership interval.
#  # Default value: 5m
#  executionTimeout: "5m"
#
#  # <duration> Grace period covering cancellation and clock skew after execution expiry.
#  # Default value: 30s
#  leaseGrace: "30s"
#
#  # <duration> Timeout for each persistence or scheduler registration operation.
#  # Default value: 10s
#  storageTimeout: "10s"
#
#  # <duration> Upper bound for a complete recovery cycle.
#  # Default value: 5m
#  recoveryTimeout: "5m"
#
#  # <duration> Per-instance deadline enabling auto-rollback by the recovery cycle.
#  # Zero disables it.
#  # Default value: 0s (disabled)
#  sagaTimeout: "0s"
#
#  # <int> Total attempts (including the first) for a forward step action.
#  # Default value: 3
#  maxStepAttempts: 3
#
#  # <duration> First exponential-backoff delay between step retries.
#  # Default value: 100ms
#  stepRetryBaseDelay: "100ms"
#
#  # <duration> Cap on the step-retry backoff.
#  # Default value: 5s
#  stepRetryMaxDelay: "5s"
#
#  # <int> Total attempts for a single compensation before the saga fails.
#  # Default value: 5
#  maxCompensationAttempts: 5
#
#  # <int> Fan-out limit for parallel-group steps (0 = core IO-bound default).
#  # Default value: 0 (core IO-bound default)
#  stepConcurrency: 0
#
#  # <string> Cron expression for the background recovery cycle.
#  # Supports descriptor format (e.g. "@every 1m") or standard cron.
#  # Default value: @every 1m
#  recoverySchedule: "@every 1m"
#
#  # <int> Maximum instances processed per recovery cycle.
#  # Default value: 100
#  recoveryBatchSize: 100
#
#  # <string> Scheduler task ID for the background recovery cycle.
#  # Default value: saga-recovery
#  recoveryTaskID: "saga-recovery"

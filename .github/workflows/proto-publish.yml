name: Proto Publish

# Generates public proto bindings (Go / Java) and mirrors them to
# per-language repositories on every main push and every vX.Y.Z tag.
# Source of truth: proto/*.proto in this repository.
#
# Target repos (must be pre-created and seeded — see proto/README.md):
#   - altessa-s/atlas-proto-gen-go
#   - altessa-s/atlas-proto-gen-java

on:
  push:
    branches: [main, develop]
    paths:
      - "proto/**"
      - ".github/workflows/proto-publish.yml"
      - ".github/scripts/sync-proto.sh"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated languages to publish (go,java)"
        default: "go,java"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, java]
    concurrency:
      group: proto-publish-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Skip if not selected (manual dispatch)
        id: gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ",${{ inputs.languages }}," == *",${{ matrix.language }},"* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop here if filtered out
        if: github.event_name == 'workflow_dispatch' && steps.gate.outputs.selected != 'true'
        run: |
          echo "language=${{ matrix.language }} not selected by dispatch input"
          exit 0

      - name: Checkout go-atlas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint GitHub App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROTO_BOT_APP_ID }}
          private-key: ${{ secrets.PROTO_BOT_PRIVATE_KEY }}
          owner: altessa-s
          repositories: atlas-proto-gen-${{ matrix.language }}

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Go proto plugins
        if: matrix.language == 'go'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.4
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Install protoc-gen-grpc-java
        if: matrix.language == 'java'
        env:
          GRPC_JAVA_VERSION: "1.68.1"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/protoc-gen-grpc-java" \
            "https://repo.maven.apache.org/maven2/io/grpc/protoc-gen-grpc-java/${GRPC_JAVA_VERSION}/protoc-gen-grpc-java-${GRPC_JAVA_VERSION}-linux-x86_64.exe"
          chmod +x "$HOME/.local/bin/protoc-gen-grpc-java"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate ${{ matrix.language }} bindings
        working-directory: proto
        run: |
          buf generate \
            --template buf.gen.${{ matrix.language }}.yaml \
            --path scheduler/v1 \
            --path protovalidate/v1

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: altessa-s/atlas-proto-gen-${{ matrix.language }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0
          ref: main

      - name: Sync, commit, push
        env:
          LANGUAGE: ${{ matrix.language }}
          TARGET_DIR: target
          SOURCE_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BOT_NAME: altessa-proto-bot
          BOT_EMAIL: 196696431+altessa-proto-bot[bot]@users.noreply.github.com
        run: .github/scripts/sync-proto.sh

      - name: Run go mod tidy in target repo
        if: matrix.language == 'go'
        working-directory: target
        run: |
          if [[ -f go.mod ]]; then
            go mod tidy
            if [[ -n "$(git status --porcelain)" ]]; then
              git config user.name altessa-proto-bot
              git config user.email "196696431+altessa-proto-bot[bot]@users.noreply.github.com"
              git add go.mod go.sum
              git commit -m "chore: go mod tidy"
              git push origin HEAD:main
            fi
          fi

      - name: Trigger JAR publish in atlas-proto-gen-java
        if: matrix.language == 'java' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api \
            --method POST \
            "/repos/altessa-s/atlas-proto-gen-java/dispatches" \
            -f event_type=publish-jar \
            -F client_payload[version]="${TAG}" \
            -F client_payload[source_sha]="${{ github.sha }}"

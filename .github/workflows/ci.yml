name: CI

on:
  workflow_call:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        module: [".", "store/postgres/migrations"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          # Build the linter with the runner's Go instead of downloading the
          # prebuilt binary: the module requires go 1.27, and a linter compiled
          # with an older Go fails typecheck on its files ("file requires newer
          # Go version").
          install-mode: goinstall

      - name: Check go fix modernizers
        if: matrix.module == '.'
        # go fix -diff exits non-zero when any modernizer would rewrite code.
        # stditerators is off: Value.Fields allocates per-field metadata that
        # value-only hot loops in domain/ deliberately avoid (see the
        # //nolint:modernize sites); golangci-lint still enforces it elsewhere.
        run: |
          for mod in $(make -s modules) tests/integration; do
            (cd "$mod" && go fix -diff -stditerators=false ./...) || { echo "::error::go fix -diff is not empty in $mod"; exit 1; }
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Check go mod tidy
        run: make tidy-check

      - name: Check architecture boundaries
        run: make check-architecture

      - name: Run tests
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Race-test migrations
        run: go -C store/postgres/migrations test -race -shuffle=on ./...

      - name: Report coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-latest
    # The suite skips every backend it cannot reach, so a broken compose stack
    # would otherwise show up as a green run with no coverage. Failing the job
    # on a startup error is what keeps the skips honest.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Start backends
        run: make integration-up

      - name: Run integration suite
        run: make test-integration

      - name: Dump backend logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail=200

      - name: Stop backends
        if: always()
        run: make integration-down

  cross-compile:
    name: Cross-compile (${{ matrix.goos }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          for mod in $(make -s modules); do
            go -C "$mod" build ./...
          done

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run govulncheck
        run: |
          (cd devtools && go install golang.org/x/vuln/cmd/govulncheck)
          for mod in $(make -s modules); do
            (cd "$mod" && govulncheck ./...)
          done

      - name: Run gosec
        run: make gosec

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the full commit history, not just the checkout.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run gitleaks (full history)
        run: gitleaks detect --redact --source . --config .gitleaks.toml

name: Fuzz

# Fuzzing is a soak, not a gate. Every fuzz target already runs on each push as
# an ordinary test over its seed corpus (`go test ./...` executes the f.Add
# inputs), so this workflow exists for the part that needs time: mutation.
on:
  schedule:
    # Nightly, off-peak.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz budget (Go duration, e.g. 2m)"
        default: "2m"
      fuzzpkg:
        description: "Package pattern to fuzz (e.g. ./core/io/wal)"
        default: "./..."

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        # A custom package pattern runs once, even if it has only one target.
        shard: ${{ fromJSON((inputs.fuzzpkg || './...') == './...' && '[1,2,3,4,5,6,7,8]' || '[1]') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          # This job manages its own cache: the interesting artifact is the
          # generated corpus under GOCACHE/fuzz, and two actions writing
          # overlapping paths would race to save it.
          cache: false

      # The corpus Go generates lives in the build cache, not in the repo.
      # Without restoring it every night restarts from the seeds and re-derives
      # the same shallow inputs; with it, coverage compounds across runs. The
      # run_id in the key makes every run save a fresh entry, and the prefix
      # restore-key picks up the most recent one.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache/fuzz
          key: fuzz-corpus-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.shard }}-of-${{ strategy.job-total }}-

      - name: Fuzz
        # Bound fuzzing before the job deadline so the runner can upload crashers.
        timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 170 }}
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
          FUZZPKG: ${{ inputs.fuzzpkg || './...' }}
          FUZZSHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make fuzz

      # A crash makes Go write the minimized reproducer to the package's
      # testdata/fuzz/<Target>/ directory. Uploading it is what turns a red
      # nightly into a file someone can commit as a permanent regression seed.
      - name: Upload crashers
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 30
